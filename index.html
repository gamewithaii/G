<!DOCTYPE html>
<html>
<head>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>
</head>
<body>

    <div id="ui" style="position: absolute; top: 10px; left: 10px; color: white; z-index: 100; font-family: sans-serif; background: rgba(0,0,0,0.5); padding: 10px;">
        <h2 id="status">Уровень: 1 | Опыт: 0</h2>
    </div>

    <a-scene webxr="referenceSpaceType: local">
        <a-assets>
            <a-asset-item id="katana-model" src="katana.glb"></a-asset-item>
        </a-assets>

        <a-entity id="rig">
            <a-camera position="0 1.6 0"></a-camera>
            
            <a-entity id="right-hand" laser-controls="hand: right" raycaster="objects: .collidable"></a-entity>
            
            <a-entity oculus-touch-controls="hand: left">
                <a-entity id="katana" gltf-model="#katana-model" position="0 0.05 -0.1" rotation="-45 0 0" scale="1 1 1"></a-entity>
            </a-entity>
        </a-entity>

        <a-box id="demon" class="collidable" position="0 1.5 -2" color="red"></a-box>

        <a-plane rotation="-90 0 0" width="10" height="10" color="#333"></a-plane>
    </a-scene>

    <script>
        let level = 1;
        let exp = 0;
        const statusText = document.getElementById('status');
        const demon = document.getElementById('demon');

        // Логика взаимодействия через контроллер
        demon.addEventListener('click', () => {
            exp += 5;
            level = Math.floor(exp / 10) + 1;
            statusText.innerHTML = `Уровень: ${level} | Опыт: ${exp}`;
            
            // Визуальный отклик
            demon.setAttribute('color', 'green');
            setTimeout(() => demon.setAttribute('color', 'red'), 200);

            // Случайный респаун
            demon.setAttribute('position', {
                x: (Math.random() - 0.5) * 4,
                y: 1.5,
                z: (Math.random() - 0.5) * 4 - 2
            });
        });

        // Распознавание речи
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'ru-RU';
            recognition.continuous = true;
            recognition.start();

            recognition.onresult = (event) => {
                const command = event.results[event.results.length - 1][0].transcript.toLowerCase();
                if (command.includes("первая ката") && level >= 3) {
                    alert("Активировано: Дыхание воды!");
                    document.getElementById('katana').setAttribute('visible', true);
                }
            };
        }
    </script>
</body>
</html>
