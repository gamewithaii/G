<!DOCTYPE html>
<html>
<head>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>
</head>
<body>

    <!-- UI для показа статуса -->
    <div id="ui" style="position: absolute; top: 10px; left: 10px; color: white; z-index: 100; font-family: sans-serif;">
        <h2 id="status">Уровень: 1 | Убей демона, чтобы прокачаться!</h2>
    </div>

    <a-scene physics="debug: false">
        <!-- Игрок -->
        <a-entity id="player" position="0 1.6 0" kinematic-body>
            <a-entity camera look-controls wasd-controls>
                <!-- Катана -->
                <a-entity id="katana" position="0.3 -0.2 -0.5" rotation="-45 0 0">
                    <a-box width="0.05" height="0.05" depth="1" color="silver"></a-box>
                </a-entity>
            </a-entity>
        </a-entity>

        <!-- Демон (Цель) -->
        <a-box id="demon" position="0 1 -3" color="red" static-body 
               onclick="hitDemon()"></a-box>

        <a-plane rotation="-90 0 0" width="10" height="10" color="#333" static-body></a-plane>
    </a-scene>

    <script>
        let level = 1;
        let exp = 0;
        const statusText = document.getElementById('status');

        // Логика убийства демона
        function hitDemon() {
            exp += 5;
            level = Math.floor(exp / 10) + 1;
            statusText.innerHTML = `Уровень: ${level} | Опыт: ${exp}`;
            alert("Демон повержен! Опыт +5");
        }

        // Распознавание речи
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'ru-RU';
        recognition.continuous = true;
        recognition.start();

        recognition.onresult = (event) => {
            const command = event.results[event.results.length - 1][0].transcript.toLowerCase();
            console.log("Распознано:", command);

            if (command.includes("первая ката") && level >= 3) {
                alert("Активировано: Дыхание воды, первая ката!");
                document.getElementById('katana').setAttribute('material', 'color: blue');
            } else if (level < 3) {
                alert("Уровень слишком низкий!");
            }
        };
    </script>
</body>
</html>
